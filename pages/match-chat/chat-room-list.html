<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test</title>
  </head>
  <body>
    <main class="wrapper">
      <div class="app-wrapper list-bg px-6">
        <div
          class="d-flex justify-content-between align-items-center py-6 mb-7"
        >
          <div><img src="/assets/images/08-icon/bell.svg" alt="" /></div>
          <h1 class="fs-20 fw-bold text-center">聊天</h1>
          <div><img src="/assets/images/08-icon/search.svg" alt="" /></div>
        </div>
        <div class="d-flex friend-list">
          <img
            src="../../assets/images/07-Match-slide/2x/chatroom-list/Chatphoto-1@2x.png"
            alt=""
            class="w-100"
          />
          <img
            src="../../assets/images/07-Match-slide/2x/chatroom-list/Chatphoto-2@2x.png"
            alt=""
            class="w-100"
          />
          <img
            src="../../assets/images/07-Match-slide/2x/chatroom-list/Chatphoto-3@2x.png"
            alt=""
            class="w-100"
          />
          <img
            src="../../assets/images/07-Match-slide/2x/chatroom-list/Chatphoto-4@2x.png"
            alt=""
            class="w-100"
          />
          <img
            src="../../assets/images/07-Match-slide/2x/chatroom-list/Chatphoto-5@2x.png"
            alt=""
            class="w-100"
          />
        </div>

        <nav class="nav-position nav-container">
          <ul class="nav nav-pills nav-bg" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="pills-home-tab"
                data-bs-toggle="pill"
                data-bs-target="#pills-home"
                type="button"
                role="tab"
                aria-controls="pills-home"
                aria-selected="true"
              >
                <img
                  src="../../assets/images/09-nav icon/User.svg"
                  alt=""
                  class="mb-1"
                />
                <p>個人</p>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="pills-quick-match-tab"
                data-bs-toggle="pill"
                data-bs-target="#pills-quick-match"
                type="button"
                role="tab"
                aria-controls="pills-quick-match"
                aria-selected="false"
              >
                <img
                  src="../../assets/images/09-nav icon/fast match.svg"
                  alt=""
                />
                <p class="mt-1">探索</p>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="pills-slide-card-tab"
                data-bs-toggle="pill"
                data-bs-target="#pills-slide-card"
                type="button"
                role="tab"
                aria-controls="pills-slide-card"
                aria-selected="false"
              >
                <img src="../../assets/images/09-nav icon/match.svg" alt="" />
                <p class="mt-1">滑卡</p>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="pills-group-talk-tab"
                data-bs-toggle="pill"
                data-bs-target="#pills-group-talk"
                type="button"
                role="tab"
                aria-controls="pills-group-talk"
                aria-selected="false"
              >
                <img
                  src="../../assets/images/09-nav icon/community.svg"
                  alt=""
                />
                <p class="mt-1">群聊</p>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="pills-chat-list-tab"
                data-bs-toggle="pill"
                data-bs-target="#pills-chat-list"
                type="button"
                role="tab"
                aria-controls="pills-chat-list"
                aria-selected="false"
              >
                <img src="../../assets/images/09-nav icon/chat.svg" alt="" />
                <p class="mt-1">聊天</p>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </main>
    <script type="module" src="../../main.js"></script>
  </body>
</html>
